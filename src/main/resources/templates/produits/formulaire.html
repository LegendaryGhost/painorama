<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="${titrePage}"></title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<header th:include="fragments/navbar"></header>

<!-- Contenu Principal -->
<main class="container mt-4">
    <h2 th:text="${titrePage}"></h2>
    <form th:action="@{/produits/sauvegarder}" th:object="${produit}" method="post" class="mt-4">
        <input type="hidden" name="id" th:field="*{id}">

        <div class="mb-3">
            <label for="nom" class="form-label">Nom</label>
            <input type="text" id="nom" th:field="*{nom}" class="form-control" placeholder="Nom de l'ingrédient"
                   required>
        </div>
        <div class="mb-3">
            <label for="prixVente" class="form-label">Prix de vente (Ar)</label>
            <input type="number" id="prixVente" th:field="*{prixVente}" step="0.01" class="form-control"
                   placeholder="Prix de vente" required>
        </div>
        <div class="mb-3">
            <label for="categorie" class="form-label">Catégorie</label>
            <select class="form-select" name="categorie" id="categorie" th:field="*{categorie}" required>
                <option th:each="categorie : ${categories}" th:value="${categorie.id}" th:text="${categorie.nom}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="parfum" class="form-label">Parfum</label>
            <select class="form-select" name="parfum" id="parfum" th:field="*{parfum}" required>
                <option th:each="parfum : ${parfums}" th:value="${parfum.id}" th:text="${parfum.nom}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" th:text="${texteBouton}"></button>
    </form>
</main>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
