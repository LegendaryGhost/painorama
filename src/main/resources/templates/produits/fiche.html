<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche produit</title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<header th:include="fragments/navbar"></header>

<main class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3>Fiche produit</h3>
        </div>
        <div class="card-body">
            <!-- Informations de base -->
            <h5>Informations générales</h5>
            <p><strong>Nom :</strong> <span th:text="${produit.nom}"></span></p>
            <p><strong>Prix de vente :</strong> <span th:text="${produit.prixVente}"></span> Ar</p>
            <p><strong>Catégorie :</strong> <span th:text="${produit.categorie.nom}"></span></p>
            <p><strong>Parfum :</strong> <span th:text="${produit.parfum.nom}"></span></p>

            <!-- Actions -->
            <h5 class="mt-4">Actions</h5>
            <div class="btn-group">
                <a th:href="@{/produits/modifier/{id}(id=${produit.id})}" class="btn btn-warning">Modifier</a>
                <a th:href="@{/produits/effacer/{id}(id=${produit.id})}" class="btn btn-danger">Supprimer</a>
                <a th:href="@{/produits/addStock/{id}(id=${produit.id})}" class="btn btn-success">Ajouter au
                    stock</a>
            </div>

            <!-- Historique des mouvements de stock -->
            <h5 class="mt-4">Historique des mouvements de stock</h5>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Date et heure</th>
                    <th>Entrée</th>
                    <th>Sortie</th>
                    <th>Produit associé</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="mouvement : ${mouvements}">
                    <td th:text="${mouvement.dateHeure}"></td>
                    <td th:text="${mouvement.quantiteEntree}"></td>
                    <td th:text="${mouvement.quantiteSortie}"></td>
                    <td>
                        <span th:if="${mouvement.produit != null}" th:text="${mouvement.produit.nom}"></span>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Liste des ingrédients -->
            <h5 class="mt-4">Liste des ingrédients</h5>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Ingrédient</th>
                    <th>Quantité</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="recette : ${recettes}">
                    <td th:text="${recette.ingredient.nom}"></td>
                    <td th:text="${recette.quantiteRequise + ' ' + recette.ingredient.unite.nom}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
