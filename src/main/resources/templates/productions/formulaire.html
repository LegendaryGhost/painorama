<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="${titrePage}"></title>
    <link rel="stylesheet" th:href="@{/bootstrap/css/bootstrap.min.css}">
</head>
<body>

<header th:include="fragments/navbar"></header>

<!-- Contenu Principal -->
<main class="container mt-4">
    <h2 th:text="${titrePage}"></h2>
    <form th:action="@{/productions/sauvegarder}" th:object="${production}" method="post" class="mt-4">
        <input type="hidden" name="id" th:field="*{id}">

        <div class="mb-3">
            <label for="dateHeure" class="form-label">Date et heure</label>
            <input type="datetime-local" id="dateHeure" name="dateHeure"
                   th:value="${#temporals.format(production.dateHeure, 'yyyy-MM-dd''T''HH:mm')}" class="form-control"
                   required>
        </div>
        <div class="mb-3">
            <label for="produit" class="form-label">Produit</label>
            <select class="form-select" name="produit" id="produit" th:field="*{produit}" required>
                <option th:each="produit : ${produits}" th:value="${produit.id}" th:text="${produit.nom}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="quantite" class="form-label">Quantité (pièces)</label>
            <input type="number" id="quantite" th:field="*{quantite}" class="form-control"
                   placeholder="Quantité" required>
        </div>
        <div class="mb-3">
            <label for="statut" class="form-label">Statut</label>
            <select class="form-select" name="statut" id="statut" th:field="*{statutProduction}" required>
                <option th:each="statut : ${statuts}" th:value="${statut.id}" th:text="${statut.nom}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary" th:text="${texteBouton}"></button>
    </form>
</main>

<script th:src="@{/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
